# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration - PostgreSQL (default)
spring.datasource.url=jdbc:postgresql://localhost:5432/tpy1101
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Alternatively, use MySQL:
# spring.datasource.url=jdbc:mysql://localhost:3306/tpy1101
# spring.datasource.username=root
# spring.datasource.password=password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Application Configuration
spring.application.name=tpy1101-backend
logging.level.root=INFO